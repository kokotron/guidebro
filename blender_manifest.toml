schema_version = "1.0.0"

id = "guidebro"
version = "0.5.4"
name = "GuideBro"
tagline = "Photoshop-style 2D and 3D guides for the camera and viewport"
maintainer = "kokotron"
type = "add-on"

website = "https://github.com/kokotron/guidebro"

tags = ["3D View", "Camera"]

blender_version_min = "4.2.0"

license = [
  "SPDX:GPL-3.0-or-later",
]

# Only the add-on goes into the built zip: no repository files.
[build]
paths_exclude_pattern = [
  "__pycache__/",
  "/.git/",
  "/.gitignore",
  "/.github/",
  "/*.zip",
]
